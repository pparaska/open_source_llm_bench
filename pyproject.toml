[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mistral-bench"
version = "0.3.0"
description = "Mistral (Ollama/CPU) evaluator with EM-LLM compatible outputs and Arrow support."
authors = [{name="You"}]
requires-python = ">=3.9"
dependencies = [
    "requests",
    "pandas",
    "numpy",
    "matplotlib",
    "datasets",
    "pyarrow",
]

[project.scripts]
mistral-bench = "mistral_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]